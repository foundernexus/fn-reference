name: rebuild-from-fn-content
# Triggers a Vercel rebuild when fn-content changes. Vercel runs python3 build.py
# (see vercel.json). Do not publish to docs/ or a gh-pages branch — Pages no longer serves.
on:
  workflow_dispatch:
  repository_dispatch:
    types: [fn-content]
jobs:
  trigger-vercel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Empty commit to trigger Vercel build on main
        run: |
          set -euo pipefail
          git config user.name grokbot
          git config user.email grokbot@foundernexus.com
          git commit --allow-empty -m "rebuild: trigger Vercel for fn-content"
          git push
